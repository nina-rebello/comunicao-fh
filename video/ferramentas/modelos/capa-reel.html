<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- Capa padrão dos reels (modelo enviado pela Nina em 09/11): topo transparente, degradê verde-noite de baixo,
     @, título branco com a palavra-chave numa pílula Tiffany e subtítulo com o trecho final em negrito.
     Medidas tiradas do modelo; preenchido pelo scripts/capa.py. -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,400..900&display=block");
:root { --tiffany: #9FC5BD; --verde: #1F3A36; --noite: 15, 31, 28; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; font-family: "Nunito", sans-serif; }
#fundo { position: absolute; inset: 0; background: linear-gradient(to bottom,
  rgba(var(--noite), 0) 0, rgba(var(--noite), 0) 760px, rgba(var(--noite), .34) 900px, rgba(var(--noite), .72) 1060px,
  rgba(var(--noite), .85) 1260px, rgba(var(--noite), .92) 1380px, rgba(var(--noite), .95) 1920px); }
#bloco { position: absolute; left: 72px; width: 936px; bottom: __BASE__px; }
#arroba { font-weight: 700; font-size: 26px; letter-spacing: .16em; color: rgba(214, 226, 222, .82); }
#titulo { margin-top: 26px; font-weight: 800; font-size: 104px; line-height: 102px; letter-spacing: -.015em; color: #FFFFFF; }
#titulo .nw { white-space: nowrap; }
#titulo .k { display: inline-block; background: var(--tiffany); color: var(--verde); border-radius: 60px;
  padding: 0 .2em; line-height: 98px; margin: 0 .02em; }
#sub { margin-top: 110px; max-width: 700px; font-weight: 400; font-size: 34px; line-height: 43px; color: rgba(214, 226, 222, .9); }
#sub b { font-weight: 800; color: #FFFFFF; }
</style>
</head>
<body>
<div id="root" data-composition-id="capa" data-start="0" data-duration="1" data-width="1080" data-height="1920">
  <div id="fundo"></div>
  <div id="bloco">
    <p id="arroba">__ARROBA__</p>
    <h1 id="titulo">__TITULO__</h1>
    <p id="sub">__SUB__</p>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__timelines["capa"] = gsapless();
function gsapless() { return { seek() {}, duration() { return 1; }, time() { return 0; }, paused() { return true; } }; }
</script>
</body>
</html>
