<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- Capa padrão dos reels. v2 (Nina, 09/11, "mais harmônico assim"): título grande em linhas curtas e
     entrelinha justa, sobre o próprio vídeo, com um degradê suave só embaixo; palavra-chave em pílula Tiffany.
     Nunito. Preenchido pelo scripts/capa.py. -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,400..900&display=block");
:root { --tiffany: #9FC5BD; --verde: #1F3A36; --noite: 15, 31, 28; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; font-family: "Nunito", sans-serif; }
#fundo { position: absolute; inset: 0; background: linear-gradient(to bottom,
  rgba(var(--noite), 0) 0, rgba(var(--noite), 0) 880px, rgba(var(--noite), .32) 1120px,
  rgba(var(--noite), .62) 1420px, rgba(var(--noite), .78) 1920px); }
#bloco { position: absolute; left: 76px; width: 880px; bottom: __BASE__px; }
#arroba { font-weight: 800; font-size: 28px; letter-spacing: .08em; color: rgba(255, 255, 255, .88);
  text-shadow: 0 2px 10px rgba(var(--noite), .5); }
#titulo { margin-top: 14px; font-weight: 800; font-size: 118px; line-height: 108px; letter-spacing: -.02em; color: #FFFFFF;
  text-shadow: 0 3px 24px rgba(var(--noite), .45); }
#titulo .nw { white-space: nowrap; }
#titulo .k { display: inline-block; background: var(--tiffany); color: var(--verde); border-radius: 60px;
  padding: 0 .16em; line-height: 104px; margin-left: -.06em; text-shadow: none; }
#sub { margin-top: 34px; max-width: 800px; font-weight: 600; font-size: 36px; line-height: 46px; color: rgba(255, 255, 255, .86);
  text-shadow: 0 2px 12px rgba(var(--noite), .55); }
#sub b { font-weight: 900; color: #FFFFFF; }
</style>
</head>
<body>
<div id="root" data-composition-id="capa" data-start="0" data-duration="1" data-width="1080" data-height="1920">
  <div id="fundo"></div>
  <div id="bloco">
    <p id="arroba">__ARROBA__</p>
    <h1 id="titulo">__TITULO__</h1>
    <p id="sub">__SUB__</p>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
window.__timelines["capa"] = gsapless();
function gsapless() { return { seek() {}, duration() { return 1; }, time() { return 0; }, paused() { return true; } }; }
</script>
</body>
</html>
