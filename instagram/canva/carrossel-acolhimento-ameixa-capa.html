<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Carrossel acolhimento: paleta verde-água + ameixa</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700;1,800&display=swap" rel="stylesheet">
<style>/* Base visual fairhealth para posts (modelo de estilo @fairedu.br). */
:root{--escuro:#2F6B64;--agua:#96C3BA;--menta:#BFE0D9;--off:#F6F8F7;--tinta:#141B1B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc;font-family:Raleway,sans-serif}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:150px 130px;margin:0 0 40px}
.escuro{background:var(--escuro);color:#fff;--acento:var(--menta);--caixa:var(--agua)}
.agua{background:var(--agua);color:var(--tinta);--acento:var(--escuro);--caixa:var(--off)}
.off{background:var(--off);color:var(--tinta);--acento:var(--escuro);--caixa:var(--agua)}
.foto{color:#fff;--acento:var(--menta);--caixa:var(--agua);background-size:cover;background-position:center}
.foto::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,27,27,.45),rgba(20,27,27,.72))}
.slide>*{position:relative}
h1{font-size:96px;line-height:1.08;font-weight:400;letter-spacing:-.5px}
h1.g{font-size:112px}
h1.m{font-size:80px}
b,em{font-weight:800;font-style:italic}
.u{text-decoration:underline;text-decoration-thickness:7px;text-underline-offset:12px;text-decoration-color:var(--acento)}
.cor{color:var(--acento)}
.sub{font-size:44px;line-height:1.3;margin-top:44px;font-weight:400}
.caixa{background:var(--caixa);color:var(--tinta);font-size:42px;line-height:1.35;padding:40px 48px;margin-top:56px}
.caixa b{color:var(--escuro)}
.num{font-size:150px;font-weight:800;font-style:italic;color:var(--acento);line-height:1;margin-bottom:36px}
.lista{list-style:none;font-size:46px;line-height:1.3;margin-top:48px;text-align:left;width:100%}
.lista li{padding:22px 0;border-bottom:3px solid color-mix(in srgb,var(--acento) 35%,transparent)}
.lista li:last-child{border:0}
.lista li span{font-weight:800;font-style:italic;color:var(--acento);margin-right:18px}
.handle{position:absolute;bottom:64px;left:0;right:0;font-size:32px;font-weight:700}
.pag{position:absolute;top:60px;right:70px;font-size:28px;font-weight:500;opacity:.6}
.seta{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
  background:var(--acento);color:var(--caixa);font-size:54px;font-weight:700;line-height:92px}
.escuro .seta,.foto .seta{color:var(--escuro)}
.agua .seta,.off .seta{color:#fff}
.logo{width:170px;margin-bottom:48px}
.lente{position:absolute;width:980px;height:520px;border-radius:50%;background:var(--menta);opacity:.55;left:50%;top:50%;transform:translate(-50%,-50%)}
.slogan{font-size:34px;font-style:italic;margin-top:56px;opacity:.85}
</style>
<style>
/* Paleta em teste: verde-água #9FC5BD (167°, claro) + ameixa #603A42 (347°, escuro).
   Opostas no círculo e com claridade espelhada: contraste 5,1 entre as duas. */
:root{--verde:#9FC5BD;--ameixa:#603A42;--creme:#F6F1EA;--rose:#EBDCDD;--verde-claro:#D6E8E3}
.slide{align-items:flex-start;text-align:left;padding:120px 110px;justify-content:center}
.slide>.handle,.slide>.pag,.slide>.seta,.slide>.circulo{position:absolute}
.kicker{font-size:26px;font-weight:700;letter-spacing:7px;text-transform:uppercase;margin-bottom:44px}
.kicker::after{content:"";display:block;width:72px;height:4px;background:currentColor;margin-top:24px}
.slide h1,.slide .sub{width:100%}
h1{font-size:104px;line-height:1.04;letter-spacing:-1.5px;font-weight:400}
h1 b{font-weight:800;font-style:italic}
.sub{font-size:42px;line-height:1.32;margin-top:40px;max-width:820px}
.handle{left:110px;right:auto;text-align:left;bottom:72px;font-size:30px}
.pag{top:72px;right:110px;opacity:.7}
.seta{left:auto;right:110px;bottom:56px;transform:none;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1}
.seta svg{width:50px;height:50px}

/* fundos */
.f-verde{background:var(--verde);color:var(--ameixa)}
.f-ameixa{background:var(--ameixa);color:var(--creme)}
.f-creme{background:var(--creme);color:var(--ameixa)}
.f-foto{color:var(--creme);background-size:cover}
.f-foto::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(96,58,66,.05) 0%,rgba(96,58,66,.35) 38%,rgba(70,40,47,.93) 78%)}
.f-foto{justify-content:flex-end;padding-bottom:210px}
.escuro-mais::before{background:linear-gradient(180deg,rgba(96,58,66,.15) 0%,rgba(80,46,54,.78) 34%,rgba(70,40,47,.95) 70%)}

/* destaques */
.em-verde{color:var(--verde)}
.sublinha{text-decoration:underline;text-decoration-color:var(--verde);text-decoration-thickness:10px;text-underline-offset:12px}
.sublinha-a{text-decoration:underline;text-decoration-color:var(--creme);text-decoration-thickness:10px;text-underline-offset:12px}

/* elementos */
.passo{display:flex;align-items:center;gap:28px;margin-bottom:56px}
.passo .n{width:132px;height:132px;border-radius:50%;border:4px solid currentColor;display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:800;font-style:italic}
.passo .t{font-size:26px;font-weight:700;letter-spacing:7px}
.circulo{position:absolute;border-radius:50%;pointer-events:none}
.pills{display:flex;flex-wrap:wrap;gap:18px;margin-top:52px;max-width:860px}
.pill{font-size:32px;font-weight:700;padding:18px 32px;border-radius:60px}
.cartao{margin-top:52px;padding:44px 52px;font-size:40px;line-height:1.35;border-radius:28px;max-width:860px}
.cartao b{font-weight:800;font-style:italic}
.split{padding:0;justify-content:flex-start}
.split .foto{width:100%;height:700px;background-size:cover;background-position:42% 40%}
.split .painel{flex:1;width:100%;padding:90px 110px 0}
.icone{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:60px}
.icone svg{width:72px;height:72px}
.centro{align-items:center;text-align:center}
.centro .sub{margin-left:auto;margin-right:auto}
.botao{display:inline-block;margin-top:56px;font-size:36px;font-weight:700;padding:26px 52px;border-radius:70px}
.assina{font-size:30px;font-style:italic;margin-top:52px;opacity:.85}
.logo-c{width:180px;margin-bottom:64px}
.lista .li{padding:22px 0;border-bottom:3px solid color-mix(in srgb,var(--acento) 35%,transparent)}.lista .li:last-child{border:0}.lista .li span{font-weight:800;font-style:italic;color:var(--acento);margin-right:18px}.flecha{border:0!important}.flecha svg{width:110px!important;height:110px!important}
</style></head><body>
<section data-document-role="page" class="slide f-foto" id="b-01" style="background-image:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/espaco/recepcao-parede-pedra.jpg);background-position:30% 18%;background-size:auto 118%">
  <div class="kicker em-verde">Escritório do Cuidado</div>
  <h1>Aqui, o cuidado<br>começa com<br><b class="em-verde">uma pergunta.</b></h1>
  <div class="seta" style="background:var(--verde)"><svg viewBox="0 0 24 24" fill="none" stroke="#603A42" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="11.2" stroke-width=".9"/><path transform="translate(6 6) scale(.5)" d="M4 12h15M13 6l6 6-6 6"/></svg></div>
  <div class="handle">@fairhealth.br</div>
</section>
</body></html>
