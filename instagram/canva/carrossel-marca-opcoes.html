<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Carrossel da marca: opções com foto do espaço</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700;1,800&display=swap" rel="stylesheet">
<style>/* Base visual fairhealth para posts (modelo de estilo @fairedu.br). */
:root{--escuro:#2F6B64;--agua:#96C3BA;--menta:#BFE0D9;--off:#F6F8F7;--tinta:#141B1B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc;font-family:Raleway,sans-serif}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:150px 130px;margin:0 0 40px}
.escuro{background:var(--escuro);color:#fff;--acento:var(--menta);--caixa:var(--agua)}
.agua{background:var(--agua);color:var(--tinta);--acento:var(--escuro);--caixa:var(--off)}
.off{background:var(--off);color:var(--tinta);--acento:var(--escuro);--caixa:var(--agua)}
.foto{color:#fff;--acento:var(--menta);--caixa:var(--agua);background-size:cover;background-position:center}
.foto::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,27,27,.45),rgba(20,27,27,.72))}
.slide>*{position:relative}
h1{font-size:96px;line-height:1.08;font-weight:400;letter-spacing:-.5px}
h1.g{font-size:112px}
h1.m{font-size:80px}
b,em{font-weight:800;font-style:italic}
.u{text-decoration:underline;text-decoration-thickness:7px;text-underline-offset:12px;text-decoration-color:var(--acento)}
.cor{color:var(--acento)}
.sub{font-size:44px;line-height:1.3;margin-top:44px;font-weight:400}
.caixa{background:var(--caixa);color:var(--tinta);font-size:42px;line-height:1.35;padding:40px 48px;margin-top:56px}
.caixa b{color:var(--escuro)}
.num{font-size:150px;font-weight:800;font-style:italic;color:var(--acento);line-height:1;margin-bottom:36px}
.lista{list-style:none;font-size:46px;line-height:1.3;margin-top:48px;text-align:left;width:100%}
.lista li{padding:22px 0;border-bottom:3px solid color-mix(in srgb,var(--acento) 35%,transparent)}
.lista li:last-child{border:0}
.lista li span{font-weight:800;font-style:italic;color:var(--acento);margin-right:18px}
.handle{position:absolute;bottom:64px;left:0;right:0;font-size:32px;font-weight:700}
.pag{position:absolute;top:60px;right:70px;font-size:28px;font-weight:500;opacity:.6}
.seta{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
  background:var(--acento);color:var(--caixa);font-size:54px;font-weight:700;line-height:92px}
.escuro .seta,.foto .seta{color:var(--escuro)}
.agua .seta,.off .seta{color:#fff}
.logo{width:170px;margin-bottom:48px}
.lente{position:absolute;width:980px;height:520px;border-radius:50%;background:var(--menta);opacity:.55;left:50%;top:50%;transform:translate(-50%,-50%)}
.slogan{font-size:34px;font-style:italic;margin-top:56px;opacity:.85}
</style>
<style>
/* fundo: foto do projeto arquitetônico com véu escuro para leitura */
.foto-espaco{color:#fff;background-size:cover;--acento:var(--menta);--caixa:var(--agua)}
.foto-espaco::before{content:"";position:absolute;inset:0;background:rgba(20,27,27,.55)}
.foto-espaco.claro::before{background:rgba(20,27,27,.42)}
.foto-espaco h1{font-size:104px;line-height:1.1;text-shadow:0 2px 24px rgba(0,0,0,.25)}
.foto-espaco .sub{font-size:40px}
.foto-espaco .marca{font-weight:800;font-style:italic}
.foto-espaco .u{text-decoration-color:var(--menta)}
.seta-cheia{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;
  background:var(--menta);display:flex;align-items:center;justify-content:center}
.seta-cheia svg{width:44px;height:44px}
.lista .li{padding:22px 0;border-bottom:3px solid color-mix(in srgb,var(--acento) 35%,transparent)}.lista .li:last-child{border:0}.lista .li span{font-weight:800;font-style:italic;color:var(--acento);margin-right:18px}.flecha{border:0!important}.flecha svg{width:110px!important;height:110px!important}
</style></head><body>

<section data-document-role="page" class="slide foto-espaco" id="m-01-foto" style="background-image:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/espaco/sala-atendimento-e-espera.jpg);background-position:52% center">
  <h1>O afastamento <b>não começa</b> no atestado.</h1>
  <p class="sub">Por que a <span class="marca">fairhealth</span> existe.</p>
  <div class="seta-cheia"><svg viewBox="0 0 24 24" fill="none" stroke="#2F6B64" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="11.2" stroke-width=".9"/><path transform="translate(6 6) scale(.5)" d="M4 12h15M13 6l6 6-6 6"/></svg></div>
  <div class="handle">@fairhealth.br</div>
</section>

<section data-document-role="page" class="slide foto-espaco claro" id="m-05-foto" style="background-image:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/espaco/recepcao-parede-pedra.jpg);background-position:30% 20%;background-size:auto 118%"><div class="pag">6/9</div>
  <h1>Por isso levamos o cuidado <b class="u">para dentro</b> da empresa.</h1>
  <p class="sub">Médicos, psicólogos e assistentes sociais onde o time <b>já está.</b></p>
  <div class="handle">@fairhealth.br</div>
</section>
</body></html>
