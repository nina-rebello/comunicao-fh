<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Carrossel: convite com caixa de comentário do Instagram</title>
<style>
/* Mesmo nível dos slides 2, 3, 4, 6 e 8 editados no Canva: cartões de interface,
   chips de vidro com ícone, etiquetas pequenas em caixa alta. Raleway, Tiffany/creme/amarelo. */
@font-face{font-family:Raleway;font-weight:400;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:500;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-500-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;font-style:italic;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-800-italic.woff2)}
:root{--t:#9FC5BD;--c:#F0F0E9;--a:#F2C14E;--k:#1F3A36}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#ccc}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 40px;color:var(--k)}
.slide>*{position:absolute}
.t{background:var(--t)} .c{background:var(--c)}
h1{font-size:100px;line-height:1.06;font-weight:400;letter-spacing:-1.5px}
h1 b{font-weight:800;font-style:italic}
.sub{font-size:38px;line-height:1.38}
.mk{background:var(--a);padding:0 14px;border-radius:14px}
.handle{bottom:80px;left:96px;font-size:28px;font-weight:700}
.passo{font-size:26px;font-weight:700;letter-spacing:5px;padding:14px 30px;border-radius:40px}
.vidro{background:rgba(255,255,255,.55);box-shadow:0 16px 40px rgba(31,58,54,.12)}
.lbl{font-size:20px;font-weight:700;letter-spacing:3px}
.ic{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:34px;height:34px}
.chip{display:flex;align-items:center;gap:20px;border-radius:30px;padding:20px 28px 20px 20px}
.chip p{font-size:30px;font-weight:700;line-height:1.2}
.chip small{display:block;font-size:22px;font-weight:400;margin-top:4px}
.lista .li{padding:22px 0;border-bottom:3px solid color-mix(in srgb,var(--acento) 35%,transparent)}.lista .li:last-child{border:0}.lista .li span{font-weight:800;font-style:italic;color:var(--acento);margin-right:18px}.flecha{border:0!important}.flecha svg{width:110px!important;height:110px!important}
</style></head><body>

</section>
</body></html>
