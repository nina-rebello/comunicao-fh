<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Carrossel acolhimento: versão suave com amarelo</title>
<style>
/* Paleta: Tiffany #9FC5BD (principal) + creme #F0F0E9 + amarelo #F2C14E (extra, sempre junto do Tiffany).
   Texto em verde-escuro #1F3A36. Fonte da marca: Raleway. Formas arredondadas, nada de caixas retas. */
@font-face{font-family:Raleway;font-weight:400;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:500;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-500-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;font-style:italic;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-800-italic.woff2)}
@font-face{font-family:Raleway;font-weight:400;font-style:italic;src:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/fontes/raleway-latin-400-italic.woff2)}
:root{--t:#9FC5BD;--c:#F0F0E9;--a:#F2C14E;--k:#1F3A36}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#ccc}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;margin:0 0 40px;color:var(--k)}
.slide>*{position:absolute}
.t{background:var(--t)} .c{background:var(--c)}
h1{font-size:104px;line-height:1.08;font-weight:400;letter-spacing:-1.5px}
h1 b{font-weight:800;font-style:italic}
.sub{font-size:40px;line-height:1.4}
.mk{background:var(--a);padding:0 14px;border-radius:14px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.handle{bottom:80px;font-size:28px;font-weight:700}
.pag{top:84px;right:96px;font-size:26px;font-weight:500;opacity:.6}
.passo{display:inline-block;font-size:28px;font-weight:700;letter-spacing:5px;padding:16px 32px;border-radius:40px}
.foto{background-size:cover;background-position:center}
.pill{font-size:46px;font-weight:700;padding:30px 56px;border-radius:70px;white-space:nowrap}
.seta{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lista .li{padding:22px 0;border-bottom:3px solid color-mix(in srgb,var(--acento) 35%,transparent)}.lista .li:last-child{border:0}.lista .li span{font-weight:800;font-style:italic;color:var(--acento);margin-right:18px}.flecha{border:0!important}.flecha svg{width:110px!important;height:110px!important}
</style></head><body>
<section data-document-role="page" class="slide c" id="y-01">
  <div class="foto" style="left:60px;right:60px;top:60px;height:620px;border-radius:60px;background-image:url(https://raw.githubusercontent.com/nina-rebello/Comunica-o-FH/claude/eager-bell-tblhnh/instagram/marca/espaco/recepcao-parede-pedra.jpg);background-position:30% 30%"></div>
    <h1 style="left:96px;top:730px;width:900px;font-size:92px">Aqui, o cuidado<br>começa com<br><b class="mk">uma pergunta.</b></h1>
  <p class="sub" style="left:96px;top:1075px;width:760px;font-size:36px">Como funciona o <b style="font-weight:800;font-style:italic">Escritório do Cuidado.</b></p>
  <div class="seta" style="right:96px;bottom:84px;background:var(--t)"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1F3A36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="11.2" stroke-width=".9"/><path transform="translate(6 6) scale(.5)" d="M4 12h15M13 6l6 6-6 6"/></svg></div>
  <div class="handle" style="left:96px">@fairhealth.br</div>
</section>
</body></html>
