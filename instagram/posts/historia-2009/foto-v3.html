<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Foto única 06/11 v3: O colaborador no centro</title>
<link rel="stylesheet" href="../../marca/base.css">
<style>

.marca{left:72px;top:56px;font-size:22px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:.9}
.rot{left:136px;top:196px;font-size:24px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#96C3BA}
.t1{left:132px;top:240px;font-size:100px;font-weight:800;letter-spacing:-3.5px;line-height:1.02;color:#fff}
.t2{left:132px;top:342px;font-size:100px;font-weight:800;letter-spacing:-3.5px;line-height:1.02;color:#fff}
.t2c{left:268px;top:342px;font-size:100px;font-weight:800;letter-spacing:-3.5px;line-height:1.02;color:#96C3BA}
.txt{left:136px;top:482px;font-size:38px;line-height:1.3;font-weight:500;color:#fff}
.pil{position:absolute;left:136px;top:546px;width:380px;height:58px;background:#2F6B64;border-radius:999px}
.pil-t{left:136px;top:557px;width:380px;text-align:center !important;font-size:30px;font-weight:700;line-height:36px;color:#fff}
</style>
<style media="canva">
body{background:none;margin:0}

</style></head><body>
