<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Foto única 06/11: O colaborador no centro</title>
<link rel="stylesheet" href="../../marca/base.css">
<style>
/* Carrossel de 06/11. Capa no visual da inspiração enviada pela Nina (foto do espaço em tela cheia,
   título grande no alto); slides 2 a 6 no padrão de instagram/carrossel.md, como o de 03/11: fundos
   alternados (off, verde-escuro, tiffany), título Raleway 800 com a segunda linha em serif itálico,
   texto corrido e fecho em serif. Fotos recortadas no tamanho da moldura por recortes.py.
   Tudo em posição fixa, para o Canva. */
:root{--agua:#9FC5BD}
@font-face{font-family:"Instrument Serif";font-style:normal;src:url(../../marca/fontes/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url(../../marca/fontes/instrument-serif-latin-400-italic.woff2)}
.ed{padding:0;text-align:left;align-items:stretch;justify-content:flex-start}
.ed.liso{background:var(--off);color:var(--tinta);--ac:var(--escuro)}
.ed.verde{background:var(--escuro);color:#fff;--ac:var(--menta)}
.ed.agua{background:var(--agua);color:var(--tinta);--ac:var(--escuro)}
.ed.foto-cheia{background:#141B1B;color:#fff}
.abs{position:absolute}
.topo{position:absolute;top:56px;left:72px;right:72px;display:flex;justify-content:space-between;
  font-size:22px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.75;z-index:3}
.foto-cheia .topo{opacity:.9;color:#fff}
.h{font-weight:800;letter-spacing:-2px;line-height:1.04}
.tit{position:absolute;font-size:66px;white-space:nowrap}
.serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;letter-spacing:-1px;line-height:1;color:var(--ac)}
.tit-s{position:absolute;font-size:82px;white-space:nowrap}
.txt{font-size:32px;line-height:1.38;text-wrap:pretty}
.txt b,.c-txt b,.cta-t b{font-style:normal}
.txt b{color:var(--escuro)}
.verde .txt b{color:var(--menta)}
.rotulo{font-size:24px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--ac)}
.fecho{font-family:"Instrument Serif",serif;font-style:italic;font-size:46px;line-height:1.05;color:var(--ac);letter-spacing:-.5px;text-wrap:pretty}
.fonte{font-size:21px;font-weight:500;opacity:.65}
.fio{position:absolute;height:2px;background:rgba(20,27,27,.16)}
.cta{position:absolute;background:var(--menta);border-radius:22px}
.pil-solida{position:absolute;background:var(--escuro);border-radius:999px}
.pil-t{position:absolute;text-align:center;font-weight:500;white-space:nowrap;line-height:1.2}
.pil-t b{font-weight:800;font-style:normal}
.img{position:absolute;display:block;object-fit:cover}
.seta{position:absolute;font-size:34px;font-weight:800;color:var(--ac)}
.item{position:absolute;font-size:32px;font-weight:600;line-height:1.2}
.selo{position:absolute;width:400px;height:58px;font-size:30px;font-weight:700;line-height:58px;white-space:nowrap}
.selo .anel{position:absolute;left:-5px;top:-5px;width:68px;height:68px;border-radius:50%;background:#fff}
.selo img{position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%}
.selo span{position:absolute;left:74px;top:0}

.dot{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--menta)}
.passo{position:absolute;font-size:34px;font-weight:600;line-height:1.2;color:#fff}
.no{position:absolute;width:60px;height:60px;border-radius:50%;background:var(--escuro)}
.no-t{position:absolute;width:60px;text-align:center;font-size:23px;font-weight:800;line-height:1.2;color:#fff}
.et{position:absolute;font-size:33px;font-weight:800;line-height:1.2}
.ed-t{position:absolute;font-size:28px;font-weight:500;line-height:1.3}
.card{position:absolute;background:rgba(255,255,255,.08);border:2px solid rgba(191,224,217,.35);border-radius:24px}
.big{position:absolute;font-weight:800;letter-spacing:-5px;line-height:1}

/* Capa (visual da inspiração): foto inteira, véu escuro no alto e título grande em branco. */
.veu{position:absolute;inset:0}
.c-rot{position:absolute;left:72px;font-size:24px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--agua)}
.c-tit{position:absolute;left:72px;font-size:100px;font-weight:800;line-height:1.02;letter-spacing:-3.5px;white-space:nowrap;color:#fff}
.c-tit .t{color:var(--agua)}
.c-txt{position:absolute;left:72px;width:900px;font-size:33px;line-height:1.4;font-weight:400;color:rgba(255,255,255,.9)}
.c-txt b{font-weight:700;color:#fff}
</style>
<style media="canva">
body{background:none;margin:0}
.slide{margin:0}
</style></head><body>

  <div class="veu" style="background:linear-gradient(rgba(14,20,19,.9) 0%,rgba(14,20,19,.78) 30%,rgba(14,20,19,.2) 52%,rgba(14,20,19,0) 70%,rgba(14,20,19,.25) 100%)"></div>
  <div class="topo"><span>@fairhealth.br</span><span></span></div>

</section>
</body></html>
