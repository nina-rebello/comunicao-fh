<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Quem cuida: capa crachá (Ronald)</title><style>
@font-face{font-family:Raleway;font-weight:400;src:url(../../marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:500;src:url(../../marca/fontes/raleway-latin-500-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(../../marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;font-style:italic;src:url(../../marca/fontes/raleway-latin-800-italic.woff2)}
:root{--t:#9FC5BD;--td:#5FA89A;--c:#F0F0E9;--k:#1F3A36;--fundo:#96C5BD}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#ccc}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--k)}
.slide>*,.cracha>*{position:absolute}
</style></head><body>
<!-- Conceito: o crachá de quem cuida. O Escritório do Cuidado funciona dentro das empresas;
     o crachá é o objeto que identifica quem está ali para cuidar. Um por integrante do time.
     Cada elemento é um bloco independente (vira um elemento separado no Canva).
     O crachá e tudo dentro dele giram -4° em torno do centro do crachá (540, 750). -->
<section class="slide" id="ronald-capa-cracha">
  <div id="fundo" style="left:0;top:0;width:1080px;height:1350px;background:var(--fundo)"></div>
  <div id="luz" style="left:0;top:0;width:1080px;height:1350px;background:radial-gradient(ellipse 55% 45% at 50% 52%,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 100%)"></div>

  <!-- cordão com a marca impressa -->
  <div id="cordao" style="left:482px;top:-20px;width:56px;height:330px;background:linear-gradient(90deg,#183230,#22433e 50%,#183230);overflow:hidden">
    <p style="position:absolute;left:28px;top:0;transform-origin:0 0;transform:rotate(90deg) translate(0,-50%);white-space:nowrap;font-size:15px;font-weight:700;letter-spacing:6px;color:var(--t);padding-left:26px">FAIR HEALTH · QUEM CUIDA · FAIR HEALTH · QUEM CUIDA</p>
  </div>

  <!-- crachá (girado) -->
  <div id="sombra" style="left:220px;top:280px;width:640px;height:940px;border-radius:40px;transform:rotate(-4deg);box-shadow:26px 44px 70px rgba(31,58,54,.30),4px 8px 18px rgba(31,58,54,.12)"></div>
  <div class="cracha" style="left:220px;top:280px;width:640px;height:940px;transform:rotate(-4deg)">
    <div id="cartao" style="left:0;top:0;width:640px;height:940px;border-radius:40px;background:#F6F6F2"></div>
    <div id="fenda" style="left:260px;top:34px;width:120px;height:18px;border-radius:9px;background:var(--k)"></div>
    <img id="logo" src="../../marca/logo-circulo.png" style="left:44px;top:76px;width:60px;height:60px">
    <p id="rotulo" style="right:44px;top:94px;font-size:19px;font-weight:700;letter-spacing:6px;color:var(--td)">QUEM CUIDA</p>
    <div id="foto" style="left:44px;top:160px;width:552px;height:540px;border-radius:26px;overflow:hidden;
      background:radial-gradient(circle at 62% 30%,#C9E2DB 0%,#9FC5BD 48%,#86B6AB 100%)">
      <img src="../../marca/time/ronald-recorte-hd.png" style="position:absolute;left:-128px;top:-50px;width:680px;height:876px">
    </div>
    <p id="nome1" style="left:44px;top:730px;font-size:50px;line-height:1;font-weight:400;letter-spacing:-1px">Dr. Ronald</p>
    <p id="nome2" style="left:40px;top:784px;font-size:68px;line-height:1;font-weight:800;font-style:italic;letter-spacing:-2px">Maia Filho</p>
    <p id="cargo" style="left:44px;top:868px;font-size:24px;font-weight:500">Fundador do Escritório do Paciente</p>
    <svg id="barras" viewBox="0 0 120 38" style="left:476px;top:862px;width:120px;height:38px" fill="#1F3A36"><path d="M0 0H3V38H0Z M6 0H10V38H6Z M12 0H14V38H12Z M16 0H19V38H16Z M21 0H23V38H21Z M26 0H28V38H26Z M30 0H34V38H30Z M38 0H40V38H38Z M43 0H45V38H43Z M49 0H51V38H49Z M53 0H55V38H53Z M57 0H59V38H57Z M63 0H65V38H63Z M68 0H70V38H68Z M73 0H76V38H73Z M80 0H82V38H80Z M84 0H86V38H84Z M88 0H90V38H88Z M93 0H95V38H93Z M98 0H101V38H98Z M103 0H105V38H103Z M107 0H109V38H107Z M111 0H113V38H111Z M116 0H120V38H116Z"/></svg>
  </div>

  <!-- prendedor metálico (por cima do cordão e da fenda) -->
  <div id="prendedor" style="left:490px;top:268px;width:40px;height:66px;border-radius:10px;transform:rotate(-4deg);
    background:linear-gradient(90deg,#9AA6A3,#E6ECEA 45%,#B9C3C0);box-shadow:0 4px 10px rgba(31,58,54,.25)">
    <div style="position:absolute;left:12px;top:10px;width:16px;height:22px;border-radius:5px;background:#5E6B68"></div>
  </div>

  <p id="arraste" style="right:80px;top:1262px;font-size:24px;font-weight:700">Arraste para o lado →</p>
</section>
</body></html>
