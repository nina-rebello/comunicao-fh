<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Quem cuida: capa Tiffany em camadas (Ronald)</title><style>
@font-face{font-family:Raleway;font-weight:400;src:url(../../marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:500;src:url(../../marca/fontes/raleway-latin-500-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(../../marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;font-style:italic;src:url(../../marca/fontes/raleway-latin-800-italic.woff2)}
:root{--t:#9FC5BD;--td:#5FA89A;--c:#F0F0E9;--k:#1F3A36}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#ccc}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--k);
  background:radial-gradient(ellipse 60% 45% at 20% 35%,#B2D3CB 0%,rgba(159,197,189,0) 100%),var(--t)}
.slide>*{position:absolute}
.cap{font-size:20px;font-weight:700;letter-spacing:6px}
.chip{font-size:24px;line-height:1.4;font-weight:700;padding:15px 28px;border-radius:40px;background:var(--t);white-space:nowrap}
</style></head><body>
<section class="slide" id="ronald-capa-camadas">
  <!-- cabeçalho -->
  <img src="../../marca/logo-circulo.png" style="left:80px;top:64px;width:68px;height:68px">
  <p style="right:80px;top:86px;font-size:24px;font-weight:700">@fairhealth.br</p>

  <!-- plano 1: painel Tiffany escuro com o retrato; a cabeça sai por cima -->
  <div style="left:500px;top:0;width:520px;height:1200px;overflow:hidden;border-radius:0 0 48px 48px">
    <div style="position:absolute;left:0;top:330px;width:520px;height:870px;border-radius:48px;
      background:radial-gradient(circle at 62% 22%,#86C0B4 0%,#5FA89A 52%,#4E9589 100%)"></div>
    <img src="../../marca/time/ronald-recorte-hd.png" style="position:absolute;left:-280px;top:152px;width:800px;height:1031px;
      filter:drop-shadow(-18px 14px 30px rgba(31,58,54,.25))">
  </div>

  <!-- plano 2: nome e frase -->
  <p class="cap" style="left:80px;top:290px">QUEM CUIDA</p>
  <h1 style="left:76px;top:332px;font-weight:400;line-height:1;letter-spacing:-2px">
    <span style="display:block;font-size:76px">Dr. Ronald</span>
    <span style="display:block;font-size:90px;font-weight:800;font-style:italic;letter-spacing:-3px;margin-top:4px">Maia Filho</span>
  </h1>
  <p style="left:80px;top:546px;width:390px;font-size:28px;line-height:1.42;font-weight:500">Fundou o Escritório do Paciente e acredita numa medicina humanizada.</p>

  <!-- plano 3: cartão creme das especialidades, por cima do painel -->
  <div style="left:60px;top:770px;width:560px;padding:36px 36px 40px;border-radius:36px;background:var(--c);
    box-shadow:0 22px 50px rgba(31,58,54,.18)">
    <p class="cap" style="font-size:17px;letter-spacing:5px;color:var(--td)">ESPECIALIDADES</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:22px">
      <span class="chip">Pediatria</span><span class="chip">Medicina do Esporte</span>
      <span class="chip">Hebiatria</span><span class="chip">Gestão hospitalar</span>
    </div>
  </div>

  <!-- plano 4: faixa escura de informação -->
  <div style="left:60px;top:1176px;width:960px;height:96px;border-radius:30px;background:var(--k);color:var(--c);
    display:flex;align-items:center;justify-content:space-between;padding:0 40px;box-shadow:0 18px 40px rgba(31,58,54,.22)">
    <p class="cap" style="font-size:17px;letter-spacing:4px;color:var(--t)">DOUTOR EM CIÊNCIAS DA SAÚDE · UNIFESP</p>
    <p style="font-size:22px;font-weight:700">Arraste para o lado →</p>
  </div>
</section>
</body></html>
