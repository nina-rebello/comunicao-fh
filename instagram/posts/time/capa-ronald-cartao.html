<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Quem cuida: capa cartão (Ronald)</title><style>
@font-face{font-family:Raleway;font-weight:400;src:url(../../marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:500;src:url(../../marca/fontes/raleway-latin-500-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(../../marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;font-style:italic;src:url(../../marca/fontes/raleway-latin-800-italic.woff2)}
:root{--t:#9FC5BD;--td:#5FA89A;--c:#F0F0E9;--k:#1F3A36;--fundo:#96C5BD}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#ccc}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--k);background:var(--fundo)}
.slide>*{position:absolute}
.cap{font-size:20px;font-weight:700;letter-spacing:6px}
.chip{font-size:24px;line-height:1.4;font-weight:700;padding:15px 28px;border-radius:40px;background:var(--t);white-space:nowrap}
</style></head><body>
<!-- Cada elemento abaixo é um bloco independente (vira um elemento separado no Canva).
     Ordem = camadas, do fundo para a frente. O fundo #96C5BD é a última camada. -->
<section class="slide" id="ronald-capa-cartao">
  <!-- aba lateral (atrás do cartão) -->
  <div id="aba" style="left:62px;top:560px;width:30px;height:210px;border-radius:12px;background:var(--td)"></div>
  <!-- bloco Tiffany escuro atrás do cartão e da cabeça (sai pela borda direita) -->
  <div id="bloco" style="left:640px;top:110px;width:480px;height:640px;border-radius:48px;background:var(--td)"></div>
  <!-- sombra do cartão -->
  <div id="sombra-cartao" style="left:80px;top:190px;width:760px;height:1000px;border-radius:56px;box-shadow:0 30px 70px rgba(31,58,54,.20)"></div>
  <!-- cartão claro -->
  <div id="cartao" style="left:80px;top:190px;width:760px;height:1000px;border-radius:56px;background:#F6F6F2"></div>
  <!-- retrato (sai pela borda direita e pela base) -->
  <img id="retrato" src="../../marca/time/ronald-recorte-esq.png" style="left:320px;top:371px;width:760px;height:979px">

  <!-- cabeçalho -->
  <img id="logo" src="../../marca/logo-circulo.png" style="left:80px;top:64px;width:68px;height:68px">

  <!-- conteúdo do cartão -->
  <div id="linha-escura" style="left:140px;top:282px;width:72px;height:10px;border-radius:5px;background:var(--k)"></div>
  <div id="linha-tiffany" style="left:216px;top:282px;width:40px;height:10px;border-radius:5px;background:var(--td)"></div>
  <p id="rotulo" class="cap" style="left:140px;top:322px">QUEM CUIDA</p>
  <p id="nome1" style="left:136px;top:364px;font-size:72px;line-height:1;font-weight:400;letter-spacing:-2px;color:var(--td)">Dr. Ronald</p>
  <p id="nome2" style="left:134px;top:440px;font-size:86px;line-height:1;font-weight:800;font-style:italic;letter-spacing:-3px">Maia Filho</p>
  <p id="frase" style="left:140px;top:566px;width:420px;font-size:28px;line-height:1.42;font-weight:500">Fundou o Escritório do Paciente e acredita numa medicina humanizada.</p>
  <span id="chip1" class="chip" style="left:140px;top:740px">Pediatria</span>
  <span id="chip2" class="chip" style="left:310px;top:740px">Medicina do Esporte</span>
  <span id="chip3" class="chip" style="left:140px;top:816px">Hebiatria</span>
  <span id="chip4" class="chip" style="left:313px;top:816px">Gestão hospitalar</span>

  <!-- bloco de informação com ícone -->
  <div id="icone-fundo" style="left:140px;top:940px;width:60px;height:60px;border-radius:16px;background:var(--k)"></div>
  <svg id="icone" viewBox="0 0 24 24" style="left:155px;top:955px;width:30px;height:30px" fill="#F0F0E9"><path d="M12 3L1 9l11 6 9-4.9V17h2V9L12 3z M5 13.2v4L12 21l7-3.8v-4L12 17l-7-3.8z"/></svg>
  <p id="doutor" class="cap" style="left:220px;top:944px;width:330px;font-size:17px;line-height:1.5;letter-spacing:4px">DOUTOR EM CIÊNCIAS DA SAÚDE · UNIFESP</p>

  <!-- etiqueta de navegação (por cima do jaleco) -->
  <div id="etiqueta" style="left:700px;top:1236px;width:320px;height:64px;border-radius:32px;background:var(--k)"></div>
  <p id="arraste" style="left:700px;top:1253px;width:320px;text-align:center;font-size:22px;font-weight:700;color:var(--c)">Arraste para o lado →</p>
</section>
</body></html>
