<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Quem cuida: capa autoridade (Ronald)</title><style>
@font-face{font-family:Raleway;font-weight:400;src:url(../../marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:500;src:url(../../marca/fontes/raleway-latin-500-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(../../marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;font-style:italic;src:url(../../marca/fontes/raleway-latin-800-italic.woff2)}
:root{--t:#9FC5BD;--td:#5FA89A;--c:#F0F0E9;--k:#1F3A36;--fundo:#96C5BD;--fio:#6C948E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#ccc}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--k)}
.slide>*{position:absolute}
.fio{height:2px;background:var(--fio)}
</style></head><body>
<!-- Capa institucional: divisão vertical Tiffany / verde-escuro, retrato em alto contraste,
     nome grande e credenciais em ficha com fios. Cada elemento é um bloco independente no Canva.
     Ordem = camadas, do fundo para a frente. O fundo #96C5BD é a última camada. -->
<section class="slide" id="ronald-capa-autoridade">
  <div id="fundo" style="left:0;top:0;width:1080px;height:1350px;background:var(--fundo)"></div>
  <div id="painel" style="left:560px;top:0;width:520px;height:1350px;background:var(--k)"></div>
  <div id="luz" style="left:560px;top:0;width:520px;height:1350px;background:radial-gradient(circle at 52% 36%,rgba(159,197,189,.30) 0%,rgba(159,197,189,0) 58%)"></div>
  <img id="retrato" src="../../marca/time/ronald-recorte-esq.png" style="left:180px;top:191px;width:900px;height:1159px">

  <img id="logo" src="../../marca/logo-circulo.png" style="left:80px;top:72px;width:68px;height:68px">
  <p id="arraste" style="right:80px;top:92px;font-size:22px;font-weight:700;color:var(--c)">Arraste para o lado →</p>

  <p id="rotulo" style="left:80px;top:300px;font-size:20px;font-weight:700;letter-spacing:6px">QUEM CUIDA</p>
  <p id="nome1" style="left:78px;top:344px;font-size:76px;line-height:1;font-weight:400;letter-spacing:-2px">Dr. Ronald</p>
  <p id="nome2" style="left:74px;top:424px;font-size:92px;line-height:1;font-weight:800;font-style:italic;letter-spacing:-3px">Maia Filho</p>
  <p id="cargo" style="left:80px;top:552px;width:470px;font-size:28px;line-height:1.35;font-weight:500">Fundador do Escritório do Paciente</p>

  <div id="fio0" class="fio" style="left:80px;top:676px;width:470px;background:var(--k)"></div>
  <p id="credenciais" style="left:80px;top:678px;width:470px;font-size:18px;line-height:45px;font-weight:700;letter-spacing:4px">MEDICINA · UNIFESP<br>DIREITO · PUC<br>DOUTOR EM CIÊNCIAS DA SAÚDE<br>VINTE ANOS EM GESTÃO HOSPITALAR</p>
  <div id="fio1" class="fio" style="left:80px;top:722px;width:470px"></div>
  <div id="fio2" class="fio" style="left:80px;top:767px;width:470px"></div>
  <div id="fio3" class="fio" style="left:80px;top:812px;width:470px"></div>
  <div id="fio4" class="fio" style="left:80px;top:857px;width:470px"></div>
</section>
</body></html>
