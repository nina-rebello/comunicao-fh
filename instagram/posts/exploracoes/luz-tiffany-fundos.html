<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fundos da Luz tiffany (para o Canva) (referências AverCare, Fountain Life, Arounda)</title><style>
@font-face{font-family:Raleway;font-weight:400;src:url(../../marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:400;font-style:italic;src:url(../../marca/fontes/raleway-latin-400-italic.woff2)}
@font-face{font-family:Raleway;font-weight:800;src:url(../../marca/fontes/raleway-latin-800-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;font-style:italic;src:url(../../marca/fontes/raleway-latin-800-italic.woff2)}
:root{--noite:#0D1816;--verde:#1F3A36;--tif:#96C5BD;--tclaro:#BFE0D9;--creme:#F0F0E9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#888;display:flex;flex-wrap:wrap;gap:40px;padding:40px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--noite);color:var(--creme);font-variant-numeric:lining-nums}
.slide>*{position:absolute}
/* luz: feixes e brilho tiffany desfocados */
.feixe{width:240px;height:2000px;background:linear-gradient(180deg,rgba(150,197,189,0),rgba(150,197,189,.55) 45%,rgba(150,197,189,0));filter:blur(40px);transform-origin:center}
.brilho{border-radius:50%;background:radial-gradient(circle,rgba(150,197,189,.55),rgba(150,197,189,0) 65%);filter:blur(30px)}
/* grão de filme por cima de tudo */
.grao{inset:0;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vinheta{inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(13,24,22,0) 35%,rgba(13,24,22,.85) 100%)}
.base{left:0;right:0;bottom:0;height:720px;background:linear-gradient(180deg,rgba(13,24,22,0),rgba(13,24,22,.92) 60%,var(--noite))}
/* tipografia */
.disp{font-size:112px;line-height:112px;letter-spacing:-0.015em;font-weight:400;background:linear-gradient(180deg,#F7F7F2,#B9C9C5);-webkit-background-clip:text;background-clip:text;color:transparent}
.k{font-weight:800;font-style:italic;color:var(--tif);-webkit-text-fill-color:var(--tif)}
.leve{font-style:italic;font-weight:400}
.tit{font-size:76px;line-height:84px;letter-spacing:-0.01em}
.sub{font-size:40px;line-height:52px;color:var(--tclaro)}
.corpo{font-size:34px;line-height:46px;color:var(--tclaro)}
.nota{font-size:24px;line-height:32px;color:var(--tclaro);opacity:.85}
.pilula{border:2px solid rgba(240,240,233,.85);border-radius:999px;padding:18px 44px;font-size:26px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.chip{border:2px solid rgba(191,224,217,.75);border-radius:999px;padding:18px 40px;font-size:32px;white-space:nowrap;text-align:center}
.handle{font-size:24px;line-height:32px;color:var(--tclaro)}
.centro{left:0;width:1080px;text-align:center}
.foto{inset:0;background-size:cover;background-position:38% 50%;filter:grayscale(.35) brightness(.55) contrast(1.1)}
.tinta{inset:0;background:var(--tif);mix-blend-mode:color;opacity:.55}
</style></head><body>

<!-- L1 · manifesto (dor): feixes de luz tiffany, grão e título embaixo -->
<section class="slide" id="fundo-luz-1">
  <div class="feixe" style="left:300px;top:-420px;transform:rotate(28deg)"></div>
  <div class="feixe" style="left:560px;top:-460px;width:160px;transform:rotate(28deg);opacity:.7"></div>
  <div class="feixe" style="left:-40px;top:-380px;width:120px;transform:rotate(28deg);opacity:.5"></div>
  <div class="brilho" style="left:620px;top:-160px;width:720px;height:720px;opacity:.6"></div>
  <div class="vinheta"></div>
  <div class="grao"></div>
</section>

<!-- L2 · diagrama: o que o exame não vê (6 pilares em volta) -->
<section class="slide" id="fundo-luz-2">
  <div class="brilho" style="left:190px;top:330px;width:700px;height:700px;opacity:.42"></div>
  <div class="vinheta"></div>
  <div class="grao"></div>
</section>

<!-- L3 · pílulas em contorno: o plano é seu -->
<section class="slide" id="fundo-luz-3">
  <div class="brilho" style="left:420px;top:-260px;width:1000px;height:1000px;opacity:.55"></div>
  <div class="feixe" style="left:820px;top:-300px;width:200px;transform:rotate(-32deg);opacity:.6"></div>
  <div class="vinheta"></div>
  <div class="grao"></div>
</section>

<!-- L4 · foto cinematográfica com luz tiffany e grão -->
<section class="slide" id="fundo-luz-4">
  <div class="foto" style="background-image:url(../../marca/fotos-banco/sono.jpg)"></div>
  <div class="tinta"></div>
  <div class="feixe" style="left:640px;top:-500px;transform:rotate(32deg);opacity:.8"></div>
  <div class="base"></div>
  <div class="grao"></div>
</section>

</body></html>
