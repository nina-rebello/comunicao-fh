<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Etiquetas</title><style>
@font-face{font-family:Raleway;font-weight:400;src:url(../../marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(../../marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;src:url(../../marca/fontes/raleway-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Raleway,sans-serif;background:#fff;color:#2b3332;width:2600px;padding:100px 110px}
h1{font-size:88px;font-weight:400;letter-spacing:-2px;margin-bottom:70px} h1 b{font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:70px 90px}
.cab{display:flex;align-items:center;gap:30px;margin-bottom:22px}
.cab h2{font-size:42px;font-weight:800}
.sw{display:flex;gap:22px;font-size:20px;font-weight:700;color:#5a6463}
.sw span{display:flex;align-items:center;gap:8px}
.sw i{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 1px #ddd}
.row{display:flex;gap:24px}
.row img{width:568px;height:710px;border-radius:18px;box-shadow:0 0 0 1px #e4e4dd,0 8px 20px rgba(0,0,0,.08)}
</style></head><body><h1>Combinações de <b>três cores</b> · modelo etiquetas</h1><div class="grid"><div><div class="cab"><h2>Tiffany + Ameixa</h2><div class="sw"><span><i style="background:#9FC5BD"></i>#9FC5BD</span><span><i style="background:#F0F0E9"></i>#F0F0E9</span><span><i style="background:#603A42"></i>#603A42</span></div></div>
<div class="row"><img src="png-pessoa/ameixa-a.png"><img src="png-pessoa/ameixa-b.png"></div></div><div><div class="cab"><h2>Tiffany + Lima</h2><div class="sw"><span><i style="background:#9FC5BD"></i>#9FC5BD</span><span><i style="background:#F0F0E9"></i>#F0F0E9</span><span><i style="background:#DAFC92"></i>#DAFC92</span></div></div>
<div class="row"><img src="png-pessoa/lima-a.png"><img src="png-pessoa/lima-b.png"></div></div><div><div class="cab"><h2>Tiffany + Coral</h2><div class="sw"><span><i style="background:#9FC5BD"></i>#9FC5BD</span><span><i style="background:#F0F0E9"></i>#F0F0E9</span><span><i style="background:#E55838"></i>#E55838</span></div></div>
<div class="row"><img src="png-pessoa/coral-a.png"><img src="png-pessoa/coral-b.png"></div></div><div><div class="cab"><h2>Tiffany + Amarelo</h2><div class="sw"><span><i style="background:#9FC5BD"></i>#9FC5BD</span><span><i style="background:#F0F0E9"></i>#F0F0E9</span><span><i style="background:#F2C14E"></i>#F2C14E</span></div></div>
