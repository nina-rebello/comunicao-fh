<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Calendário de conteúdo · novembro 2026</title>
<style>
@font-face{font-family:Raleway;font-weight:400;src:url(../../instagram/marca/fontes/raleway-latin-400-normal.woff2)}
@font-face{font-family:Raleway;font-weight:400;font-style:italic;src:url(../../instagram/marca/fontes/raleway-latin-400-italic.woff2)}
@font-face{font-family:Raleway;font-weight:500;src:url(../../instagram/marca/fontes/raleway-latin-500-normal.woff2)}
@font-face{font-family:Raleway;font-weight:700;src:url(../../instagram/marca/fontes/raleway-latin-700-normal.woff2)}
@font-face{font-family:Raleway;font-weight:800;src:url(../../instagram/marca/fontes/raleway-latin-800-normal.woff2)}
:root{--fundo:#EFF0EB;--escuro:#1F3B36;--verde:#2F6B64;--reel:#9CC5BC;--linha:#A9CFC6;--apagado:#B9C4C1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc;font-family:Raleway,sans-serif;font-variant-numeric:lining-nums}
#calendario{width:1920px;height:1380px;background:var(--fundo);padding:56px 72px 40px;color:var(--escuro);position:relative}
h1{font-size:72px;font-weight:400;letter-spacing:-1px}
h1 b{font-weight:800}
.sub{font-size:28px;color:var(--verde);margin-top:10px;font-weight:500}
.legenda{position:absolute;top:70px;right:72px;display:flex;gap:56px;font-size:26px;align-items:center}
.legenda span{display:flex;align-items:center;gap:18px}
.legenda i{display:inline-block;width:92px;height:30px;border-radius:16px}
.grade{display:grid;grid-template-columns:170px repeat(7,1fr);margin-top:36px}
.dia-sem{text-align:center;font-size:26px;font-weight:500;padding-bottom:16px}
.semana{display:flex;flex-direction:column;justify-content:center;font-size:24px;font-weight:700;line-height:1.25}
.semana small{font-size:19px;font-weight:400}
.cel{border:1.5px solid var(--linha);margin:0 -1.5px -1.5px 0;height:170px;padding:10px 10px;display:flex;flex-direction:column}
.cel .n{font-size:19px;color:var(--verde);font-weight:500}
.cel.fora .n{color:var(--apagado)}
.cel .data{font-size:18px;font-style:italic;color:var(--verde);margin-top:8px;line-height:1.3}
.post{flex:1;margin-top:6px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:8px 12px;font-weight:700;line-height:1.28;position:relative}
.post.reel{background:var(--reel);color:var(--escuro)}
.post.carrossel{background:var(--escuro);color:#fff}
.post.foto{background:#fff;color:var(--escuro);border:2px solid var(--escuro)}
.post{padding-top:24px}
.post::before{content:attr(data-eixo);position:absolute;top:6px;left:10px;font-size:12px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;opacity:.75}
.post.novo::after{content:'novo';position:absolute;top:6px;right:10px;font-size:12px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;opacity:.75}
.rodape{margin-top:26px;font-size:24px;color:var(--verde);font-weight:500;display:flex;justify-content:space-between}
.rodape em{font-style:normal;opacity:.75}
</style>
</head>
<body>
<section class="slide" id="calendario">
  <h1><b>Calendário</b> de conteúdo</h1>
  <p class="sub">01/11 a 30/11 &nbsp;·&nbsp; 3 posts por semana</p>
  <div class="legenda">
    <span><i style="background:var(--reel)"></i>Reel</span>
    <span><i style="background:var(--escuro)"></i>Carrossel</span>
    <span><i style="background:#fff;border:2px solid var(--escuro)"></i>Foto única</span>
  </div>
  <div class="grade" id="grade"></div>
  <p class="rodape" id="rodape"></p>
</section>
<script>
// Para editar: troque o texto ou o formato aqui (reel, carrossel ou foto).
// [formato, texto, tamanho da fonte, novo?, eixo, tipo]
// tipo: institucional, produto ou evento.
// novo: true marca as pautas sugeridas para completar o mês.
// eixo: mercado, cases, cultura, notícias ou produto (ver instagram/carrossel-de-tendencia.md).
const posts = {
  '2026-11-03': ['carrossel', 'O cuidado na prática (P – PIC) Argumentos Marília', 19, false, 'produto', 'produto'],
  '2026-11-04': ['reel', 'Quatro frentes, um Cuidado (P/ RH Plataforma entrega relatorio (menos sobre Plataforma mais sobre relatorio)', 13, false, 'produto', 'produto'],
  '2026-11-06': ['carrossel', 'Uma história desde 2009 Validar com RONALD (historio do escritorio e nao FH)', 15, false, 'cases', 'institucional'],
  '2026-11-09': ['reel', 'Resultados reais, com o Dr. Ronald', 20, false, 'cases', 'produto'],
  '2026-11-11': ['carrossel', 'Estilo de vida é tratamento sério', 20, false, 'cultura', 'produto'],
  '2026-11-13': ['carrossel', 'Como levar a FairHealth à empresa (comerical!!!! CTA!)', 17, false, 'produto', 'produto'],
  '2026-11-16': ['reel', 'Novembro Azul: ele só vai ao médico quando dói. E se o cuidado estivesse no trabalho?', 15, true, 'cultura', 'evento'],
  '2026-11-18': ['carrossel', 'Recorde de afastamentos por saúde mental: o que a NR-01 cobra do RH (guia via CUIDADO)', 14, true, 'notícias', 'produto'],
  '2026-11-19': ['foto', 'Depoimento: “Os meus hábitos mudaram, e não foi um sacrifício.”', 16, true, 'cases', 'produto'],
  '2026-11-23': ['reel', 'O RH cuida de todo mundo. Quem cuida do RH? (dados Flash 2026)', 16, true, 'notícias', 'produto'],
  '2026-11-25': ['carrossel', 'Por que a Geração Z está tão desconectada do trabalho?', 17, true, 'cultura', 'produto'],
  '2026-11-27': ['carrossel', 'Case Chemitec: como 98% do time aceitou ser cuidado · CTA CUIDADO', 15, true, 'cases', 'produto'],
  '2026-11-30': ['reel', 'Dezembro chegou: a corrida das metas também adoece', 16, true, 'cultura', 'evento'],
};
const datas = {
  '2026-11-02': 'Finados',
  '2026-11-14': 'Dia Mundial do Diabetes',
  '2026-11-15': 'Proclamação da República',
  '2026-11-20': 'Dia da Consciência Negra (feriado)',
};
const primeiraSemana = 2; // continua a numeração do calendário de 19/10 (semana 1)

const g = document.getElementById('grade');
g.insertAdjacentHTML('beforeend', '<div></div>' + ['seg','ter','qua','qui','sex','sáb','dom'].map(d => `<div class="dia-sem">${d}</div>`).join(''));
const dd = d => String(d.getDate()).padStart(2, '0');
const mm = d => String(d.getMonth() + 1).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${mm(d)}-${dd(d)}`;
let ini = new Date(2026, 9, 26); // segunda da semana de 01/11
const cont = {reel: 0, carrossel: 0, foto: 0};
for (let s = 0; s < 6; s++) {
  const fim = new Date(ini); fim.setDate(fim.getDate() + 6);
  const ultimoUtil = new Date(ini); ultimoUtil.setDate(ultimoUtil.getDate() + 4);
  g.insertAdjacentHTML('beforeend', `<div class="semana">Semana ${primeiraSemana + s}<small>${dd(ini)}/${mm(ini)} a ${dd(ultimoUtil)}/${mm(ultimoUtil)}</small></div>`);
  for (let i = 0; i < 7; i++) {
    const d = new Date(ini); d.setDate(d.getDate() + i);
    const fora = d.getMonth() !== 10;
    let h = `<div class="cel${fora ? ' fora' : ''}"><span class="n">${dd(d)}</span>`;
    const p = !fora && posts[iso(d)];
    if (p) {
      cont[p[0]]++;
      h += `<div class="post ${p[0]}${p[3] ? ' novo' : ''}" data-eixo="${[...new Set([p[5], p[4]].filter(Boolean))].join(' · ')}" style="font-size:${p[2]}px">${p[1]}</div>`;
    }
    if (!fora && datas[iso(d)]) h += `<span class="data">${datas[iso(d)]}</span>`;
    g.insertAdjacentHTML('beforeend', h + '</div>');
  }
  ini.setDate(ini.getDate() + 7);
}
const pl = (n, s, p) => `${n} ${n === 1 ? s : p}`;
document.getElementById('rodape').innerHTML =
  `<span>${pl(cont.reel,'reel','reels')} &nbsp;·&nbsp; ${pl(cont.carrossel,'carrossel','carrosséis')} &nbsp;·&nbsp; ${pl(cont.foto,'foto única','fotos únicas')} &nbsp;·&nbsp; 1 reel e 2 posts estáticos por semana</span>` +
  `<em>no canto: tipo · eixo narrativo · “novo” = pauta sugerida</em>`;
</script>
</body>
</html>
